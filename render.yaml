# Render deployment blueprint. Configure production data, official account onboarding,
# authorized authority providers, and the matching frontend origin before public operation.
services:
  - type: web
    name: tracenza-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      # "demo" seeds the synthetic demo accounts (public default passwords!). Use "production" for real
      # use: no demo accounts, first admin comes from BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD.
      - key: ENVIRONMENT
        value: demo
      - key: FRONTEND_ORIGINS
        sync: false   # e.g. https://tracenza.vercel.app (your Vercel URL, no trailing slash)
      - key: SECRET_KEY
        generateValue: true
      - key: USE_MINIO
        value: "false"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Portal Administrator
      - key: DATABASE_URL
        fromDatabase:
          name: tracenza-db
          property: connectionString

databases:
  - name: tracenza-db
    databaseName: tracenza
    user: tracenza
    plan: free
    region: singapore
